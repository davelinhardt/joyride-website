<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joyride — Contact</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png"><link rel="icon" type="image/svg+xml" href="/assets/mark-black.svg?v=3"><link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon-180.png">
<link rel="stylesheet" href="/styles.css">
<style>
  .contact-hero { padding-block: clamp(48px, 7vw, 96px) clamp(32px, 4vw, 56px); }
  .contact-hero h1 { font-size: clamp(48px, 8vw, 112px); font-weight: 700; letter-spacing: -0.045em; line-height: 0.94; }

  .contact-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: var(--s8); align-items: start; }
  @media (max-width: 880px) { .contact-grid { grid-template-columns: 1fr; gap: var(--s7); } }

  /* Right column: photo above a single service-area card. */
  .contact-side { display: grid; gap: var(--s5); }
  .contact-photo {
    border-radius: var(--r-xl); overflow: hidden;
    aspect-ratio: 4/3; border: 1px solid var(--rule);
  }
  .contact-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  @media (max-width: 880px) { .contact-photo { aspect-ratio: 16/9; } }

  .service-area { padding: var(--s6); border: 1px solid var(--rule); border-radius: var(--r-lg); background: var(--white); }
  .service-area .lbl { font-size: 12px; font-weight: 600; color: var(--ink-3); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: var(--s3); }
  .service-area .v { font-size: clamp(24px, 2.6vw, 34px); font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; color: var(--canary); }
  .service-area p { margin-top: var(--s3); color: var(--ink-2); font-size: 16px; }

  form.contact-form { display: grid; gap: var(--s5); padding: var(--s7); background: var(--canary); border-radius: var(--r-xl); }
  form.contact-form .field input, form.contact-form .field textarea, form.contact-form .field select { background: rgba(255,255,255,0.7); border-color: transparent; }
  form.contact-form .field input:focus, form.contact-form .field textarea:focus, form.contact-form .field select:focus { background: var(--white); }

  /* Inline error banner. Ink-on-canary so it reads on the yellow card
     (the global canary-surface rule would otherwise force it to ink and
     lose the red). */
  .form-error {
    padding: 12px 16px; border-radius: 12px;
    background: rgba(0,0,0,0.08); border: 1.5px solid #B00020;
    color: #7A0016 !important; font-size: 15px; font-weight: 500;
  }
  .form-error[hidden] { display: none; }
  form.contact-form button[aria-busy="true"] { opacity: .6; cursor: progress; }

  /* Success state replaces the form body. */
  .form-done { display: grid; gap: var(--s4); }
  .form-done h2 { font-size: clamp(28px, 3vw, 40px); }
  .form-done p { color: var(--ink-2); }
</style>
</head>
<body data-page="contact">

<main>
  <section class="contact-hero wrap">
    <span class="eyebrow">Contact</span>
    <h1 class="mt-4">Say hi.</h1>
    <p class="lead mt-5" style="font-size: clamp(18px, 1.6vw, 22px);">Rider support, driver applications, press, partnerships. We read every message.</p>
  </section>

  <section class="section wrap">
    <div class="contact-grid">
      <form class="contact-form" id="contactForm" novalidate>
        <h2 style="font-size: clamp(28px, 3vw, 40px);">Send us a message.</h2>
        <div class="form-error" id="formError" role="alert" hidden></div>
        <div class="field"><label for="cf-name">Your name</label><input id="cf-name" name="name" required placeholder="Name" autocomplete="name"></div>
        <div class="field"><label for="cf-email">Email</label><input id="cf-email" name="email" required type="email" placeholder="you@example.com" autocomplete="email"></div>
        <div class="field"><label for="cf-subject">I'm reaching out about</label><select id="cf-subject" name="subject"><option>Book a ride</option><option>Rider support</option><option>Driving with Joyride</option><option>Press</option><option>Partnerships</option><option>Investors</option></select></div>
        <div class="field"><label for="cf-message">Message</label><textarea id="cf-message" name="message" required placeholder="Tell us a bit..." rows="5"></textarea></div>
        <button class="btn btn--primary" type="submit" style="justify-self: start;">Send <span class="arrow">→</span></button>
      </form>

      <div class="contact-side">
        <div class="contact-photo">
          <img src="/assets/rider-driver.webp" alt="A professional chauffeur at the wheel of a premium vehicle">
        </div>
        <div class="service-area">
          <div class="lbl">Service area</div>
          <div class="v">Raleigh-Durham</div>
          <p>Currently operating in the Raleigh-Durham area.</p>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="/js/api.js"></script>
<script src="/site.js"></script>
<script>
/**
 * Contact form → POST /api/public/contact on the Railway API.
 *
 * This form used to call preventDefault(), swap its own innerHTML for
 * "Thanks — we'll be in touch soon," and throw the message away. It now
 * creates a real `inquiries` row and emails dave@joyride.cool; the
 * submission shows up in /admin under Inbound.
 *
 * We only render the success state after the server confirms the write,
 * so "we'll be in touch" is never shown for a message that didn't land.
 */
(function () {
  var form = document.getElementById("contactForm");
  if (!form) return;
  var errorBox = document.getElementById("formError");
  var button = form.querySelector('button[type="submit"]');

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.hidden = false;
    errorBox.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  function clearError() {
    errorBox.hidden = true;
    errorBox.textContent = "";
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    clearError();

    var name = form.elements.name.value.trim();
    var email = form.elements.email.value.trim();
    var subject = form.elements.subject.value;
    var message = form.elements.message.value.trim();

    // Client-side checks mirror the server's so the common mistakes get
    // an instant answer. The server re-validates regardless.
    if (!name || !email || !message) {
      showError("Please fill in your name, email, and message.");
      return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showError("That email address doesn't look right.");
      return;
    }
    if (message.length > 5000) {
      showError("Message is too long — please keep it under 5000 characters.");
      return;
    }

    button.setAttribute("aria-busy", "true");
    button.disabled = true;
    var originalLabel = button.innerHTML;
    button.innerHTML = "Sending…";

    try {
      var base = (window.JoyrideAPI && window.JoyrideAPI.API_BASE) || "";
      var res = await fetch(base + "/api/public/contact", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: name,
          email: email,
          subject: subject,
          message: message,
          sourcePage: window.location.pathname,
        }),
      });

      if (!res.ok) {
        var detail = "";
        try {
          detail = (await res.json()).error || "";
        } catch (_) { /* non-JSON error body */ }
        showError(detail || "Something went wrong. Please try again.");
        button.removeAttribute("aria-busy");
        button.disabled = false;
        button.innerHTML = originalLabel;
        return;
      }

      form.innerHTML =
        '<div class="form-done">' +
          "<h2>Thanks — we'll be in touch soon.</h2>" +
          "<p>Your message is with our team. We read every one.</p>" +
        "</div>";
    } catch (err) {
      // Network failure / API unreachable — the message did NOT land.
      showError("We couldn't reach our servers. Please try again, or email hello@joyride.cool.");
      button.removeAttribute("aria-busy");
      button.disabled = false;
      button.innerHTML = originalLabel;
    }
  });
})();
</script>
</body>
</html>
